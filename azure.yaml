# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.33.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
    azure.ai.projects: '>=1.0.0-beta.8'

name: dotnet-maf-foundry-m365copilot-sample

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 50

  it-helper:
    host: azure.ai.agent
    kind: hosted
    name: it-helper
    displayName: IT Helper
    description: A .NET 10 Microsoft Agent Framework sample that triages common IT support requests.
    project: src/IThelper.Agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: it-helper.dll
      dependencyResolution: remote_build
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
